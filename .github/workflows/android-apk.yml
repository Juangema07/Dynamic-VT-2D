name: Android Debug APK

on:
  push:
    branches: [main]
    # Build-status commits are generated by this workflow; ignore them to avoid
    # starting another build for every status update.
    paths-ignore:
      - 'BUILD_STATUS.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Avoid concurrent release/status writes racing against each other.
concurrency:
  group: dynamic-vt-2d-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fix overlay window title shadowing
        run: |
          sed -i 's/val title = TextView(this)/val headerTitle = TextView(this)/' app/src/main/java/com/juangema/dynamicvt2d/AvatarOverlayService.kt
          sed -i 's/header.addView(title, LinearLayout.LayoutParams/header.addView(headerTitle, LinearLayout.LayoutParams/' app/src/main/java/com/juangema/dynamicvt2d/AvatarOverlayService.kt
      - name: Build debug APK
        id: build
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-VT-2D-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK release
        id: release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dynamic VT-2D build ${{ github.run_number }}
          body: |
            APK de prueba generado automáticamente desde la rama main.
            Consulta README para las funciones implementadas y sus limitaciones.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record build status for verification
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        env:
          BUILD_STATE: ${{ steps.build.outcome }}
          UPLOAD_STATE: ${{ steps.upload.outcome }}
          RELEASE_STATE: ${{ steps.release.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const body = [
              '# Dynamic VT-2D APK build',
              '',
              `- Compile: ${process.env.BUILD_STATE}`,
              `- Artifact upload: ${process.env.UPLOAD_STATE}`,
              `- GitHub release: ${process.env.RELEASE_STATE}`,
              `- Source: \`${process.env.SOURCE_SHA}\``,
              `- Workflow run: ${process.env.RUN_URL}`,
              ''
            ].join('\n');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path: 'BUILD_STATUS.md', ref: 'main' });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'BUILD_STATUS.md',
              message: 'Record Android APK build status',
              content: Buffer.from(body).toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });
